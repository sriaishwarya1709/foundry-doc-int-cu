name: deploy

on:
  push:
    branches: [main]
    paths: ["infra/**", "src/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
    inputs:
      seed:
        description: "Ingest the bundled sample documents after deployment"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  ENVIRONMENT_NAME: ${{ vars.ENVIRONMENT_NAME }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  DEPLOYMENT_NAME: docdemo-${{ github.run_number }}
  # GitHub drops job outputs it suspects contain secrets, so each job reads the Bicep outputs from Azure.
  LOAD_OUTPUTS: >-
    az deployment group show -g "$AZURE_RESOURCE_GROUP" -n "$DEPLOYMENT_NAME" --query properties.outputs -o json
    | jq -r 'to_entries[] | "\(.key)=\(.value.value)"' >> "$GITHUB_ENV"

jobs:
  infra:
    name: Provision infrastructure (Bicep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group
        run: az group create -n "$AZURE_RESOURCE_GROUP" -l "$AZURE_LOCATION" -o none

      - name: Deploy main.bicep
        id: deploy
        env:
          DEPLOYER_PRINCIPAL_ID: ${{ vars.AZURE_SP_OBJECT_ID }}
          DEPLOYER_PRINCIPAL_TYPE: ServicePrincipal
        run: |
          az deployment group create \
            -g "$AZURE_RESOURCE_GROUP" \
            -n "$DEPLOYMENT_NAME" \
            --parameters infra/main.bicepparam \
            --query properties.outputs -o json | jq 'map_values(.value)'

  deploy-app:
    name: Deploy web app
    needs: infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Load deployment outputs
        run: eval "$LOAD_OUTPUTS"

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEB_APP_NAME }}
          package: src

  bootstrap:
    name: Configure CU defaults, Search index and Foundry agent
    needs: infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/requirements.txt

      - run: pip install -r src/requirements.txt

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Load deployment outputs
        run: eval "$LOAD_OUTPUTS"

      - name: Bootstrap (retries while new role assignments propagate)
        working-directory: src
        run: |
          for i in 1 2 3 4 5; do
            python -m app.bootstrap && exit 0
            echo "Attempt $i failed, waiting 60s for RBAC propagation..."; sleep 60
          done
          exit 1

  smoke-test:
    name: Smoke test
    needs: [infra, deploy-app, bootstrap]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Load deployment outputs
        run: eval "$LOAD_OUTPUTS"

      - name: Health check
        run: |
          url="$WEB_APP_URL"
          for i in $(seq 1 20); do
            curl -fsS "$url/healthz" && curl -fsS "$url/api/config" && break
            [ "$i" = "20" ] && exit 1
            sleep 15
          done

      - name: Seed sample documents (both engines)
        if: ${{ inputs.seed }}
        run: |
          url="$WEB_APP_URL"
          seed() {
            curl -fsS --max-time 600 -F "file=@samples/$1" -F engine=both -F di_model=$2 -F cu_analyzer=$3 \
              "$url/api/ingest" | jq -c '.results[] | {engine, model, chunks_indexed}'
          }
          seed invoice-contoso.pdf prebuilt-invoice prebuilt-invoice
          seed receipt-contoso.png prebuilt-receipt prebuilt-receipt
          seed contract-property-management.pdf prebuilt-contract prebuilt-documentSearch
